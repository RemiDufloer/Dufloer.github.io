<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaching</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/class.css">
</head>
<body>

<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="talks.html">Talks</a></li>
            <li><a href="teaching.html">Teaching</a></li>
            <li><a href="survey.html">Survey</a></li>
            <li><a href="papers.html">Publications</a></li>
        </ul>
    </nav>
</header>

<div class="container">

    <div class="header">
        <h1>Teaching</h1>
        <p>Enseignements</p>
    </div>

    <div class="filters" id="filters">
        <button class="filter-btn active" onclick="filterCourses('all', this)">All</button>
    </div>

    <p class="count" id="count"></p>


    <div class="courses" id="courses-list"></div>
</div>

<script>
function renderCourse(c) {
    const badges = [`<span class="badge level">${c.niveau}</span>`]
        .concat(c.types.map(t => `<span class="badge ${t.toLowerCase()}">${t}</span>`))
        .join('');

    return `
        <div class="course-card" data-year="${c.annee}">
            <span class="course-year">${c.annee}</span>
            <div>
                <p class="course-title">${c.titre}</p>
                <p class="course-desc">${c.description}</p>
                <div class="course-meta">${badges}</div>
            </div>
        </div>`;
}

function filterCourses(year, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    let visible = 0;
    document.querySelectorAll('.course-card').forEach(card => {
        const match = year === 'all' || card.dataset.year === year;
        card.style.display = match ? '' : 'none';
        if (match) visible++;
    });

    document.getElementById('count').textContent = visible + ' cours';
}

async function loadCourses() {
    const res = await fetch('cours/cours.json');
    const { cours } = await res.json();


    cours.sort((a, b) => b.annee - a.annee);
    document.getElementById('courses-list').innerHTML = cours.map(renderCourse).join('');


    const years = [...new Set(cours.map(c => String(c.annee)))];
    const filters = document.getElementById('filters');
    years.forEach(y => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = y;
        btn.onclick = () => filterCourses(y, btn);
        filters.appendChild(btn);
    });

    filterCourses('all', filters.querySelector('.filter-btn'));
}

loadCourses();
</script>

</body>
</html>
