<div class="container">

    <div class="header">
        <h1>Contact</h1>
        <p>Feel free to reach out</p>
    </div>

    <div class="contacts" id="contacts"></div>
</div>

<script>
async function loadContact() {
    const res = await fetch('contact/contact.json');
    const c = await res.json();
    const items = [];

    if (c.email) {
        items.push({ label: 'Email', value: c.email, href: `mailto:${c.email}` });
    }
    if (c.github) {
        items.push({ label: 'GitHub', value: `github.com/${c.github}`, href: `https://github.com/${c.github}` });
    }

    document.getElementById('contacts').innerHTML = items.map(i => `
        <a class="contact-card" href="${i.href}" ${i.href.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>
            <span class="contact-label">${i.label}</span>
            <span class="contact-value">${i.value}</span>
        </a>`).join('');
}

loadContact();
</script>

</body>
