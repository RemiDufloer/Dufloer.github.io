<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/papers.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="talks.html">Talks</a></li>
                <li><a href="survey.html">Survey</a></li>
                <li><a href="class.html">Teaching</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="header">
            <h1>Publications</h1>
            <p>Recherches et articles publiés</p>
        </div>

        <div class="filters" id="filters">
            <button class="filter-btn active" onclick="filterPapers('all', this)">Tout</button>
            <!-- les boutons d'année sont ajoutés ici par le script -->
            <button class="filter-btn" id="filter-conf" onclick="filterPapers('conf', this)">Conférences</button>
            <button class="filter-btn" onclick="filterPapers('journal', this)">Journaux</button>
            <button class="filter-btn" onclick="filterPapers('workshop', this)">Workshops</button>
        </div>

        <p class="count" id="count"></p>

        <!-- Les publications sont chargées depuis publication/publication.json -->
        <div class="papers" id="papers-list"></div>
    </div>

    <script>
        const ME = 'Rémi Dufloer';
        const PDF_ICON = '<svg viewBox="0 0 16 16"><path d="M3 1.5A1.5 1.5 0 0 1 4.5 0h5.086a1.5 1.5 0 0 1 1.06.44l2.915 2.914A1.5 1.5 0 0 1 14 4.414V14.5A1.5 1.5 0 0 1 12.5 16h-8A1.5 1.5 0 0 1 3 14.5v-13zm1.5-.5a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5V4.414a.5.5 0 0 0-.146-.353L9.939 1.146A.5.5 0 0 0 9.586 1H4.5z"/><path d="M5.5 7.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5zm0 2a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5zm0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5z"/></svg>';

        function renderPaper(p) {
            const auteurs = p.auteurs
                .map(a => a === ME ? `<strong>${a}</strong>` : a)
                .join(', ');
            const date = [p.lieu, p.date].filter(Boolean).join(' · ');
            const pdf = p.fichier
                ? `<div class="paper-actions">
                       <a class="btn-pdf" href="${p.fichier}" download>${PDF_ICON} PDF</a>
                   </div>`
                : '';

            return `
                <div class="paper-card" data-year="${p.annee}" data-type="${p.type}">
                    <span class="paper-year">${p.annee}</span>
                    <div class="paper-body">
                        <p class="paper-title">${p.titre}</p>
                        <p class="paper-authors">${auteurs}</p>
                        <div class="paper-meta">
                            <span class="conf-badge ${p.type}">${p.venue}</span>
                            <span class="paper-date">${date}</span>
                        </div>
                    </div>
                    ${pdf}
                </div>`;
        }

        function filterPapers(filter, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.paper-card');
            let visible = 0;
            cards.forEach(card => {
                const match = filter === 'all'
                    || card.dataset.year === filter
                    || card.dataset.type === filter;
                card.style.display = match ? '' : 'none';
                if (match) visible++;
            });
            document.getElementById('count').textContent =
                visible + ' publication' + (visible > 1 ? 's' : '');
        }

        async function loadPapers() {
            const res = await fetch('publication/publication.json');
            const { publications } = await res.json();

            // Du plus récent au plus ancien
            publications.sort((a, b) => b.annee - a.annee);
            document.getElementById('papers-list').innerHTML = publications.map(renderPaper).join('');

            // Un bouton par année présente dans le JSON, avant les filtres par type
            const years = [...new Set(publications.map(p => String(p.annee)))].sort();
            const filters = document.getElementById('filters');
            const firstType = document.getElementById('filter-conf');
            years.forEach(y => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = y;
                btn.onclick = () => filterPapers(y, btn);
                filters.insertBefore(btn, firstType);
            });

            filterPapers('all', filters.querySelector('.filter-btn'));
        }

        loadPapers();
    </script>
</body>
</html>
