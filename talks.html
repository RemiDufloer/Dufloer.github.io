<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/talks.css">
</head>
<body>

<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="papers.html">Publications</a></li>
            <li><a href="talks.html">Talks</a></li>
            <li><a href="survey.html">Survey</a></li>
            <li><a href="class.html">Teaching</a></li>
            <li><a href="competences.html">Skills</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="container">

    <div class="header">
        <h1>Talks</h1>
        <p>Scientific talks and presentations</p>
    </div>

    <div class="filters" id="filters">
        <button class="filter-btn active" onclick="filterTalks('all', this)">All</button>
    </div>

    <p class="count" id="count"></p>

    <div class="talks" id="talks-list"></div>
</div>

<script>
function renderTalk(t) {
    const meta = [t.venue, t.lieu].filter(Boolean).join(' · ');
    const slides = t.fichier
        ? `<div class="talk-actions">
               <a class="btn-download" href="${t.fichier}" download>Slides (PDF)</a>
           </div>`
        : '';

    return `
        <div class="talk-card" data-year="${t.annee}">
            <span class="talk-year">${t.annee}</span>
            <div class="talk-body">
                <p class="talk-title">${t.titre}</p>
                <p class="talk-meta">${meta}</p>
                <p class="talk-date">${t.date || ''}</p>
            </div>
            ${slides}
        </div>`;
}

function filterTalks(year, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    let visible = 0;
    document.querySelectorAll('.talk-card').forEach(card => {
        const match = year === 'all' || card.dataset.year === year;
        card.style.display = match ? '' : 'none';
        if (match) visible++;
    });

    document.getElementById('count').textContent = visible + ' talk' + (visible > 1 ? 's' : '');
}

async function loadTalks() {
    const res = await fetch('talks/talks.json');
    const { talks } = await res.json();

    talks.sort((a, b) => b.annee - a.annee);
    document.getElementById('talks-list').innerHTML = talks.map(renderTalk).join('');

    const years = [...new Set(talks.map(t => String(t.annee)))];
    const filters = document.getElementById('filters');
    years.forEach(y => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = y;
        btn.onclick = () => filterTalks(y, btn);
        filters.appendChild(btn);
    });

    filterTalks('all', filters.querySelector('.filter-btn'));
}

loadTalks();
</script>

</body>
</html>
